[package]
name = "limner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
limner-core = { version = "0.1.0", path = "../limner-core" }
limner-export = { version = "0.1.0", path = "../limner-export" }
limner-format = { version = "0.1.0", path = "../limner-format" }
limner-quill = { version = "0.1.0", path = "../limner-quill" }
thiserror = "2.0.21"
serde_json = "1.0.154"

[dev-dependencies]
limner-format = { path = "../limner-format", features = ["testing"] }
limner-quill = { path = "../limner-quill", features = ["testing"] }
tempfile = "3.27.0"
