[package]
name = "limner-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "limner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
limner = { version = "0.2.1", path = "../limner" }
serde_json = "1.0.154"

[dev-dependencies]
limner-quill = { path = "../limner-quill", features = ["testing"] }
tempfile = "3.27.0"
