[package]
name = "limner-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes helpers that compare documents and build exhaustive test documents.
testing = []

[dependencies]
blake3 = "1.8.7"
limner-core = { version = "0.2.1", path = "../limner-core" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: every f64 written to limn.json must parse back to the same bits.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
zip = { version = "9.0.3", default-features = false }
zstd = { version = "0.14.2", default-features = false }

[dev-dependencies]
limner-format = { path = ".", features = ["testing"] }
limner-quill = { path = "../limner-quill", features = ["testing"] }
tempfile = "3.27.0"
