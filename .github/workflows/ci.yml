# Runs the Rust tests and the interface tests (headless Godot) on Linux, macOS
# and Windows, using the same scripts a person would use.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Godot
        if: runner.os != 'Windows'
        run: scripts/fetch-godot.sh
      - name: Fetch Godot
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-godot.ps1
      - name: Rust and interface tests
        if: runner.os != 'Windows'
        run: scripts/test.sh
      - name: Rust and interface tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test.ps1
